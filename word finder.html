<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Search Game</title>
<style>
/* =========================
   GLOBAL
========================= */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e5e7eb;
}

/* =========================
   APP CONTAINER
========================= */
.app {
    background: #ffffff;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 900px;
}

/* =========================
   LOGO SECTION - ADDED
========================= */
.logo-section {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    padding: 8px 0;
}

.logo {
    height: 60px;
    width: auto;
    margin-right: 16px;
}

.logo-text {
    font-size: 20px;
    font-weight: 700;
    color: #4f46e5;
}

/* =========================
   HEADER
========================= */
.header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: linear-gradient(135deg, #4f46e5, #3b82f6);
    padding: 14px 18px;
    border-radius: 14px;
    color: #ffffff;
}

.header-left h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
}

.header-center {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.header-center select {
    appearance: none;
    border: none;
    border-radius: 8px;
    padding: 6px 28px 6px 12px;
    font-size: 14px;
    font-weight: 600;
    background: #ffffff;
    color: #1e293b;
    cursor: pointer;
}

.header-right {
    text-align: right;
}

.header-right h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

/* =========================
   INFO BAR
========================= */
.info {
    margin-top: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.info div {
    background: #f1f5f9;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
    box-shadow: inset 0 0 0 1px #e2e8f0;
}

/* =========================
   GAME AREA
========================= */
.game {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 16px;
    margin-top: 16px;
}

/* =========================
   GRID
========================= */
.grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
}

.cell {
    background: #e6f2ff;
    border-radius: 8px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    aspect-ratio: 1;
    font-size: 18px;
    transition: background 0.25s ease, transform 0.1s ease;
}

.cell:hover {
    background: #bbdefb;
}

.cell.selected {
    background: #64b5f6;
    color: #ffffff;
}

.cell.found {
    background: #43a047;
    color: #ffffff;
}

/* =========================
   WORD LIST PANEL
========================= */
.words {
    background: #f8fafc;
    border-radius: 16px;
    padding: 16px;
    box-shadow: inset 0 0 0 1px #e2e8f0;
}

.words ul {
    padding: 0;
    margin: 0;
}

.words li {
    list-style: none;
    padding: 8px 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    transition: all 0.3s ease;
}

.words li.found {
    background: #dcfce7;
    color: #166534;
    text-decoration: line-through;
    transform: scale(0.97);
}

/* =========================
   POPUP
========================= */
.popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup-content {
    background: #ffffff;
    padding: 22px;
    border-radius: 16px;
    text-align: center;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 768px) {
    .logo-section {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .logo {
        height: 50px;
        margin-bottom: 8px;
    }
    
    .header {
        grid-template-columns: 1fr;
        gap: 10px;
        text-align: center;
    }

    .header-right {
        text-align: center;
    }

    .game {
        grid-template-columns: 1fr;
    }

    .grid {
        gap: 3px;
    }

    .cell {
        font-size: 16px;
    }
}

@media (max-width: 480px) {
    .logo {
        height: 40px;
    }
    
    .cell {
        font-size: 14px;
    }
}

</style>
</head>
<body>
<div class="app">

    <!-- LOGO SECTION - ADDED -->
    <div class="logo-section">
        <img src="https://www.icfitnessclub.com/wp-content/uploads/2024/02/wcsc-logo-01.webp" alt="Logo" class="logo">
        <div class="logo-text">Word Finder </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h2>Word Finder Game</h2>
        </div>

        <div class="header-center">
            <select id="category">
    <option value="english">English Vocabulary</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="javascript">JavaScript</option>
    <option value="php">PHP</option>
    <option value="mysql">MySQL</option>
    <option value="python">Python</option>
</select>


            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="header-right">
            <h3>Find Words</h3>
        </div>
    </div>

    <!-- INFO BAR -->
    <div class="info">
        <div>Level: <span id="level">1</span></div>
        <div>Time: <span id="time">03:00</span></div>
        <div>Difficulty: <span id="difficultyLabel">Easy</span></div>
    </div>

    <!-- GAME AREA -->
    <div class="game">
        <div class="grid" id="grid"></div>

        <div class="words">
            <ul id="wordList"></ul>
        </div>
    </div>

</div>


<div class="popup" id="popup">
    <div class="popup-content">
        <h2 id="popupTitle">🎉 Congratulations 🎉</h2>
        <p id="popupMsg"></p>
        <button onclick="nextLevel()">Continue</button>
    </div>
</div>

<script>
const gridSize = 10;
const wordsPerLevel = 5;
const TIME_LIMIT = 180; // 3 minutes

const levelBackgrounds = [
    "linear-gradient(135deg, #667eea, #764ba2)",
    "linear-gradient(135deg, #ff9966, #ff5e62)",
    "linear-gradient(135deg, #56ab2f, #a8e063)",
    "linear-gradient(135deg, #ff6a00, #ee0979)",
    "linear-gradient(135deg, #00c6ff, #0072ff)",
    "linear-gradient(135deg, #f7971e, #ffd200)"
];

const difficultyBackgrounds = {
    easy: "linear-gradient(135deg, #a8edea, #fed6e3)",
    medium: "linear-gradient(135deg, #fbc2eb, #a6c1ee)",
    hard: "linear-gradient(135deg, #ff512f, #dd2476)"
};

const wordBank = {
  english: {
    easy: [
      "CAT","DOG","SUN","MOON","TREE","BOOK","BALL","FISH","BIRD","STAR",
      "MILK","RAIN","ROAD","HOME","FOOD"
    ],
    medium: [
      "HAPPY","RIVER","GARDEN","FRIEND","SCHOOL","FLOWER","MARKET","FAMILY",
      "FOREST","CLOUD","MUSIC","LIGHT","WINDOW","ORANGE","SMILE"
    ],
    hard: [
      "ADVENTURE","KNOWLEDGE","IMPORTANT","CELEBRATION","EXPERIENCE",
      "COMMUNICATION","ENVIRONMENT","DEVELOPMENT","TECHNOLOGY","DISCOVERY",
      "CONFIDENCE","RESPONSIBILITY","OPPORTUNITY","IMAGINATION","CREATIVITY",
      "UNDERSTANDING","ACHIEVEMENT","EDUCATION","INDEPENDENT","PERSONALITY"
    ]
  },

  html: {
    easy: [
      "HTML","TAG","LINK","PAGE","TEXT","IMAGE","VIDEO","AUDIO",
      "TITLE","BODY","HEAD","FORM","TABLE","LIST","META"
    ],
    medium: [
      "ATTRIBUTE","ELEMENT","INPUT","BUTTON","LABEL","DIV","SPAN",
      "HEADER","FOOTER","SECTION","ARTICLE","NAV","IFRAME","CANVAS","SCRIPT"
    ],
    hard: [
      "SEMANTIC","ACCESSIBILITY","RESPONSIVE","VIEWPORT","VALIDATION",
      "EMBED","MULTIMEDIA","STRUCTURE","SEO","DOCTYPE",
      "MICRODATA","TEMPLATE","SHADOWDOM","CUSTOMELEMENT"
    ]
  },

  css: {
    easy: [
      "CSS","COLOR","FONT","BORDER","MARGIN","PADDING","HEIGHT","WIDTH",
      "BACKGROUND","TEXT","STYLE","DISPLAY","ALIGN","FLOAT","CLEAR"
    ],
    medium: [
      "FLEXBOX","GRID","POSITION","OVERFLOW","ZINDEX","OPACITY","OUTLINE",
      "TRANSITION","ANIMATION","TRANSFORM","SHADOW","GRADIENT","MEDIA","VARIABLE"
    ],
    hard: [
      "RESPONSIVE","KEYFRAMES","PSEUDOCLASS","PSEUDOELEMENT",
      "SPECIFICITY","INHERITANCE","CUSTOMPROPERTY","CALC",
      "CLIPPATH","FILTER","OBJECTFIT","SCROLLSNAP","CONTAINERQUERY"
    ]
  },

  javascript: {
    easy: [
      "JS","ARRAY","OBJECT","STRING","NUMBER","BOOLEAN","FUNCTION",
      "EVENT","CLICK","ALERT","PROMPT","CONSOLE","VARIABLE","LET","CONST"
    ],
    medium: [
      "JAVASCRIPT","CONDITION","LOOP","FOREACH","MAP","FILTER","REDUCE",
      "DOM","QUERY","LISTENER","TIMEOUT","INTERVAL","ARROW","SPREAD","DESTRUCTURE"
    ],
    hard: [
      "ASYNC","AWAIT","PROMISE","CALLBACK","CLOSURE","HOISTING",
      "PROTOTYPE","SCOPE","EVENTLOOP","FETCH","MODULE","BIND","APPLY",
      "THISKEYWORD","MEMORYLEAK"
    ]
  },

  php: {
    easy: [
      "PHP","ECHO","PRINT","STRING","NUMBER","ARRAY","VARIABLE",
      "SERVER","FORM","POST","GET","COOKIE","SESSION","INCLUDE","REQUIRE"
    ],
    medium: [
      "FUNCTION","CONDITION","LOOP","FOREACH","ASSOCIATIVE",
      "SUPERGLOBAL","UPLOAD","VALIDATION","DATE","TIME","JSON","FILTER",
      "HEADER","REDIRECT","MAIL"
    ],
    hard: [
      "OOP","CLASS","OBJECT","INHERITANCE","POLYMORPHISM",
      "ABSTRACTION","INTERFACE","TRAIT","NAMESPACE","EXCEPTION",
      "PREPAREDSTATEMENT","SECURITY","MVC","FRAMEWORK","COMPOSER"
    ]
  },

  mysql: {
    easy: [
      "MYSQL","DATABASE","TABLE","ROW","COLUMN","DATA",
      "INSERT","SELECT","UPDATE","DELETE","WHERE","ORDER","LIMIT","INDEX","PRIMARY"
    ],
    medium: [
      "QUERY","JOIN","INNER","LEFT","RIGHT","FOREIGN",
      "GROUP","HAVING","COUNT","SUM","AVG","MIN","MAX","DISTINCT","UNION"
    ],
    hard: [
      "NORMALIZATION","RELATIONSHIP","SUBQUERY","TRANSACTION",
      "TRIGGER","PROCEDURE","FUNCTION","VIEW","CONSTRAINT",
      "OPTIMIZATION","LOCKING","ACID","REPLICATION","BACKUP","SECURITY"
    ]
  },

  python: {
    easy: [
      "PYTHON","PRINT","INPUT","STRING","NUMBER","BOOLEAN",
      "LIST","TUPLE","SET","DICT","VARIABLE","COMMENT","INDENT","LOOP","RANGE"
    ],
    medium: [
      "FUNCTION","MODULE","PACKAGE","IMPORT","EXCEPTION",
      "FILE","READ","WRITE","CLASS","OBJECT","METHOD","LAMBDA","COMPREHENSION",
      "ITERATOR","GENERATOR"
    ],
    hard: [
      "DECORATOR","INHERITANCE","POLYMORPHISM","ABSTRACTION",
      "MULTITHREADING","MULTIPROCESSING","ASYNCIO","COROUTINE",
      "MEMORYMANAGEMENT","GIL","VIRTUALENV","PICKLE","SERIALIZATION",
      "METACLASS","DESCRIPTOR"
    ]
  }
};


let category = "english";
let difficulty = "easy";
let level = 0;
let words = [];
let grid = [];
let foundCount = 0;
let selected = [];
let startCell = null;
let timeLeft = TIME_LIMIT;
let timer = null;

const gridEl = document.getElementById("grid");
const wordList = document.getElementById("wordList");
const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popupTitle");
const popupMsg = document.getElementById("popupMsg");
const levelEl = document.getElementById("level");
const timeEl = document.getElementById("time");
const categorySelect = document.getElementById("category");
const difficultySelect = document.getElementById("difficulty");
const difficultyLabel = document.getElementById("difficultyLabel");

// Category & Difficulty changes
categorySelect.onchange = () => {
    category = categorySelect.value;
    level = 0;
    nextLevel(true);
};

difficultySelect.onchange = () => {
    difficulty = difficultySelect.value;
    difficultyLabel.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
    document.body.style.background = difficultyBackgrounds[difficulty];
    level = 0;
    nextLevel(true);
};

// Timer
function startTimer() {
    clearInterval(timer);
    timeLeft = TIME_LIMIT;
    updateTime();
    timer = setInterval(() => {
        timeLeft--;
        updateTime();
        if (timeLeft <= 0) {
            clearInterval(timer);
            showPopup("⏰ Time Over", "Try the level again!");
        }
    }, 1000);
}

function updateTime() {
    const m = String(Math.floor(timeLeft / 60)).padStart(2,"0");
    const s = String(timeLeft % 60).padStart(2,"0");
    timeEl.textContent = `${m}:${s}`;
}

// Grid setup
function initGrid() {
    grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(""));
}

function placeWord(word) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    let placed = false;
    let attempts = 0;
    while (!placed && attempts < 100) {
        attempts++;
        const [dx,dy] = dirs[Math.floor(Math.random()*dirs.length)];
        const r = Math.floor(Math.random()*gridSize);
        const c = Math.floor(Math.random()*gridSize);
        if (word.split("").every((l,i)=>{
            const nr=r+dx*i, nc=c+dy*i;
            return grid[nr]?.[nc]==="";
        })) {
            word.split("").forEach((l,i)=>{
                grid[r+dx*i][c+dy*i]=l;
            });
            placed=true;
        }
    }
}

function fillLetters() {
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){
            if(!grid[r][c]){
                grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
            }
        }
    }
}

function renderGrid() {
    gridEl.innerHTML="";
    grid.forEach((row,r)=>{
        row.forEach((l,c)=>{
            const cell=document.createElement("div");
            cell.className="cell";
            cell.textContent=l;
            cell.dataset.row=r;
            cell.dataset.col=c;

            // Mouse events
            cell.onmousedown=()=>{clearSelection(); startCell=cell; select(cell);};
            cell.onmouseenter=()=>{if(startCell) select(cell);};

            // Touch events for mobile
            cell.ontouchstart=(e)=>{e.preventDefault(); clearSelection(); startCell=cell; select(cell);};
            cell.ontouchmove=(e)=>{
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if(target && target.classList.contains('cell')) select(target);
            };

            gridEl.appendChild(cell);
        });
    });
}

// Clear selection on mouse/touch end
document.onmouseup=()=>{if(startCell) checkWord(); startCell=null;};
document.ontouchend=()=>{if(startCell) checkWord(); startCell=null;};

function select(cell){
    if(selected.includes(cell)) return;
    if(selected.length){
        const a=selected[0];
        const dr=cell.dataset.row-a.dataset.row;
        const dc=cell.dataset.col-a.dataset.col;
        if(Math.abs(dr)!==Math.abs(dc) && dr!==0 && dc!==0) return;
    }
    selected.push(cell);
    cell.classList.add("selected");
}

function clearSelection(){
    selected.forEach(c=>c.classList.remove("selected"));
    selected=[];
}

function checkWord(){
    const text=selected.map(c=>c.textContent).join("");
    const rev=text.split("").reverse().join("");
    let match=false;
    words.forEach(w=>{
        const li=document.getElementById(w);
        if(!li.classList.contains("found")&&(w===text||w===rev)){
            match=true;
            foundCount++;
            selected.forEach(c=>{c.classList.remove("selected"); c.classList.add("found");});
            li.classList.add("found");
        }
    });
    if(!match) clearSelection();
    if(foundCount===words.length){
        clearInterval(timer);
        showPopup("🎉 Congratulations", "Level completed!");
    }
    selected=[];
}

function renderWords(){
    wordList.innerHTML="";
    words.forEach(w=>{
        const li=document.createElement("li");
        li.textContent=w;
        li.id=w;
        wordList.appendChild(li);
    });
}

function showPopup(title,msg){
    popupTitle.textContent = title;
    popupMsg.textContent = msg;
    popup.style.display = "flex";
}

function nextLevel(reset=false){
    popup.style.display="none";
    foundCount=0;
    clearInterval(timer);

    if(!reset) level++;
    levelEl.textContent = level + 1;

    // Change background gradient per level
    const bg = levelBackgrounds[level % levelBackgrounds.length];
    document.body.style.background = bg;

    // Safe random word selection
    const bank = [...wordBank[category][difficulty]]; // clone
    words = [];
    while(words.length < wordsPerLevel) {
        const idx = Math.floor(Math.random() * bank.length);
        words.push(bank[idx]);
        bank.splice(idx,1); // remove to avoid duplicates
        if(bank.length === 0) break;
    }

    initGrid();
    renderWords();
    words.forEach(placeWord);
    fillLetters();
    renderGrid();
    startTimer();
}

// Initialize
difficultyLabel.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
document.body.style.background = difficultyBackgrounds[difficulty];
nextLevel(true);
</script>
</body>
</html>
